<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Vefsíða</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="mynd4.png">
	</head>

	<body>
		<div class="page-wrap">
			<main>
				<div class="container">
					<div class="left">
						<h1>SVEINN VALFELLS.</h1>
					</div>

					<div class="right">
						<img id="dvd-img" src="mynd4.png" alt="mynd" />
					</div>
				</div>
			</main>
		</div>

		<script>
			const dvdImg = document.getElementById('dvd-img');
			let floating = false;
			let x = 0, y = 0;
			let dx = 2, dy = 2;

			dvdImg.addEventListener('click', () => {
				if (floating) return;

				floating = true;
				const rect = dvdImg.getBoundingClientRect();
				x = rect.left;
				y = rect.top;

				document.body.appendChild(dvdImg);
				dvdImg.classList.add('floating');
				animate();
			});

			function animate() {
				if (!floating) return;

				const imgWidth = dvdImg.offsetWidth;
				const imgHeight = dvdImg.offsetHeight;
				const maxX = window.innerWidth - imgWidth;
				const maxY = window.innerHeight - imgHeight;

				x += dx;
				y += dy;

				if (x <= 0 || x >= maxX) dx *= -1;
				if (y <= 0 || y >= maxY) dy *= -1;

				x = Math.max(0, Math.min(x, maxX));
				y = Math.max(0, Math.min(y, maxY));

				dvdImg.style.transform = `translate(${x}px, ${y}px)`;

				requestAnimationFrame(animate);
			}
		</script>
	</body>
</html>
