<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Vefsíða</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="mynd4.png">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
	</head>

	<body>
		<div class="page-wrap">
			<main>
				<div class="container">
					<div class="left">
						<h1>SVEINN<br>VALFELLS<br>.IS</h1>
					</div>
					
					<div class="right">
    					<img id="dvd-img" src="mynd4.png" alt="mynd" />
					</div>
					
				</div>
					

				<div class="curious-btn">
					<a href="about.html">Feeling curious?</a>
				</div>
			</main>
		</div>

		<script>
			const dvdImg = document.getElementById('dvd-img');
			let floating = false;
			let x = 0, y = 0;
			let dx = 2, dy = 2;

			const images = [
				'mynd4.png',
				'mynd1.png',
				'mynd2.png',
				'mynd7.png',
				'mynd3.png',
				'mynd5.png',
				'mynd6.png'
			];
			let imgIndex = 0;
			dvdImg.addEventListener('click', () => {
    			if (floating) return;

    			floating = true;
    			dvdImg.style.animation = 'none';  // <-- add this line

    			const rect = dvdImg.getBoundingClientRect();
   				x = rect.left;
    			y = rect.top;

    			document.body.appendChild(dvdImg);
    			dvdImg.classList.add('floating');
    			animate();
			});
		

			function nextImage() {
				imgIndex = (imgIndex + 1) % images.length;
				dvdImg.src = images[imgIndex];
			}

			function animate() {
				if (!floating) return;

				const imgWidth = dvdImg.offsetWidth;
				const imgHeight = dvdImg.offsetHeight;
				const maxX = window.innerWidth - imgWidth;
				const maxY = window.innerHeight - imgHeight;

				x += dx;
				y += dy;

				let bounced = false;

				if (x <= 0 || x >= maxX) {
					dx *= -1;
					bounced = true;
				}
				if (y <= 0 || y >= maxY) {
					dy *= -1;
					bounced = true;
				}

				if (bounced) nextImage();

				x = Math.max(0, Math.min(x, maxX));
				y = Math.max(0, Math.min(y, maxY));

				dvdImg.style.transform = `translate(${x}px, ${y}px)`;

				requestAnimationFrame(animate);
			}
		</script>
	</body>
</html>
